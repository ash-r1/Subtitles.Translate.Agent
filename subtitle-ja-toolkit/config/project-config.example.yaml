# プロジェクト設定（作品ごとにコピーして project-config.yaml として使う）
# 使い方: cp config/project-config.example.yaml <作業ディレクトリ>/project-config.yaml

project:
  title: "Example: Harbor Watch S01E01"   # 作品名（任意の管理用）
  source_language: en                      # 原語。auto で自動判定
  target_language: ja
  subtitle_format: srt                     # srt | vtt（ass は未対応。事前に srt/vtt へ変換）

paths:
  # input_subtitle / output_subtitle は単一ファイル時のみ使用（series.enabled: false）。
  # シリーズ時は series.episodes の input と output/<episode_id>.srt を使う。
  input_subtitle: input/source.srt         # 元字幕（読み取り専用。変更禁止）
  work_dir: work/                          # 中間成果物の置き場所
  output_subtitle: output/translated.srt   # 最終出力

# シリーズ（複数ファイル）運用（詳細は CLAUDE.md「シリーズ（複数ファイル）運用」）。
# Step 1–4 の分析をシリーズ全体で 1 回だけ行い（成果物は work/_shared/）、
# Step 5–10 をエピソード単位のループで回す。
series:
  enabled: false           # false = 単一ファイル（既定）。true でシリーズモード
  # 翻訳対象のエピソード一覧（enabled: true のとき使用）。id は work/<id>/・
  # output/<id>.srt・evidence の id プレフィックスに用いる（例: ep02/sub:45）。
  episodes: []
  #   - {id: ep01, input: input/ep01.srt}
  #   - {id: ep02, input: input/ep02.srt}
  #   - {id: ep03, input: input/ep03.srt}
  # 人間が重点確認するエピソード（決定シートで質問し、回答をこの欄に記録する）。
  # パイロットの代表選定にも使う。不要なら null。
  priority_episodes: null  # 例: [ep01, ep05]

# 公式資料（あれば列挙。glossary はこれを最優先で採用する）
official_references:
  - type: character_names                  # 公式訳・公式読みの資料
    path: null                             # 例: refs/official-names.md
  - type: prior_episode_glossary           # 続き物の場合、前話の glossary
    path: null                             # 例: ../S01E00/work/03-glossary.json

# 外部参照資料（Step 4 翻訳前検証が不明点の解決・表記の傍証に使う。なければ null のまま）
# 優先順位: 公式日本語資料 > 映像の音声・画面内テキスト > 他言語公式字幕 > ファン wiki > 推測
external_references:
  video: null              # 例: refs/episode01.mp4（不明箇所は ffmpeg でフレーム抽出して確認）
  storyboard: null         # 例: refs/storyboard/（コンテ・脚本・設定資料）
  official_site: null      # 例: 公式サイト・公式 SNS の URL
  community_wiki: null     # 例: ファン wiki の URL（傍証のみ。公式訳としては扱わない）
  other: []                # その他（インタビュー・既存の他言語字幕など）

# Step 4 翻訳前検証ゲートの設定
pretranslation_check:
  pilot_scope: auto        # auto = 代表場面を Step 4 が選ぶ / [4, 5] のようにバッチ番号指定も可
  pilot_batch_count: 1     # パイロットで翻訳するバッチ数（1〜2 推奨）

# バッチ処理設定
batching:
  batch_size: 20               # 1 バッチの字幕数
  preceding_context_lines: 8   # 前方の確定訳を何行見せるか（元実装の 2 は狭すぎるため拡大）
  following_context_lines: 5   # 後方の原文プレビュー行数
  # バッチ境界で文が切れる場合、その文の意味単位を含むまで文脈を自動拡張する
  expand_to_sentence_boundary: true

# 工程の有効/無効
pipeline:
  enable_pretranslation_check: true  # Step 4（ゲート。確認事項が既知の再実行時のみ false 推奨）
  enable_semantic_review: true       # Step 6
  enable_voice_review: true          # Step 7
  enable_polish: true                # Step 8
  enable_timing_adjust: true         # Step 9
  enable_final_audit: true           # Step 10

# サブエージェント割り当て（CLAUDE.md「サブエージェント運用」参照）
agents:
  step1_director:             {model: opus,   effort: high}
  step2_character:            {model: opus,   effort: high}
  step3_glossary:             {model: sonnet, effort: medium}
  step4_pretranslation_check: {model: opus,   effort: high}
  step4_native_check:         {model: opus,   effort: medium}  # 別文脈で日本語のみを読む担当
  step5_translate:            {model: sonnet, effort: high}
  step6_semantic_review:      {model: sonnet, effort: medium}
  step7_voice_review:         {model: sonnet, effort: medium}
  step8_polish:               {model: opus,   effort: medium}
  step9_timing:               {model: haiku,  effort: low}
  step10_final_audit:         {model: opus,   effort: high}

# 視聴者・スタイルの事前指定（あれば Step 1 が最優先で採用）
style_overrides:
  audience: null            # 例: "配信サービスの一般視聴者"
  register_baseline: null   # 例: "常体基本、目上には丁寧語"
  notes: null
